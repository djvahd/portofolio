<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adriel | Fast websites for small businesses in Australia &amp; Singapore</title>
    <meta
      name="description"
      content="Web developer and designer building fast, mobile-first websites that bring small businesses more enquiries. Fixed prices from AUD 1,200, with a free homepage mock-up first."
    />
    <!-- Update these URLs when the site moves to its own domain -->
    <link rel="canonical" href="https://adriel-portofolio.pages.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://adriel-portofolio.pages.dev/" />
    <meta property="og:title" content="Adriel | Fast websites for small businesses" />
    <meta
      property="og:description"
      content="Fast, mobile-first websites that bring small businesses more enquiries. Fixed prices, free homepage mock-up."
    />
    <meta property="og:image" content="https://adriel-portofolio.pages.dev/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Adriel, web developer and designer: fast websites that bring small businesses more enquiries."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The hero portrait is the largest thing on screen: fetch it before the JS bundle asks for it -->
    <link rel="preload" as="image" href="/images/hero-cutout.webp" type="image/webp" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
